plugins {
    id 'com.android.application'
}

android {
    namespace 'com.calendar.app'
    compileSdk 23

    defaultConfig {
        applicationId "com.calendar.app"
        minSdk 21
        targetSdk 23
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
