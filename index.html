<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日历事件</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <span class="logo">📅 日历事件</span>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="container main-grid">

      <!-- 日历区域 -->
      <section class="calendar-section">
        <div class="calendar-header">
          <button class="cal-nav" id="prevMonth">&lt;</button>
          <h2 class="cal-title" id="calTitle"></h2>
          <button class="cal-nav" id="nextMonth">&gt;</button>
          <button class="cal-today-btn" id="todayBtn">今天</button>
        </div>
        <div class="calendar-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </section>

      <!-- 事件区域 -->
      <section class="events-section">
        <div class="events-header">
          <h3 class="events-date" id="eventsDate"></h3>
          <button class="add-btn" id="addBtn">+ 添加事件</button>
        </div>
        <div class="events-list" id="eventsList">
          <p class="empty-msg" id="emptyMsg">暂无事件</p>
        </div>
      </section>

    </div>
  </main>

  <!-- 添加事件弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>添加事件</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <form class="modal-form" id="eventForm">
        <div class="form-group">
          <label>事件名称</label>
          <input type="text" id="eventTitle" placeholder="输入事件名称" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>开始时间</label>
            <input type="time" id="eventStart" required />
          </div>
          <div class="form-group">
            <label>结束时间</label>
            <input type="time" id="eventEnd" required />
          </div>
        </div>
        <div class="form-group">
          <label>描述（可选）</label>
          <textarea id="eventDesc" rows="3" placeholder="输入事件描述"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-cancel" id="cancelBtn">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
