name: Android Build

on:
  push:
    branches: [ master, 'claude/**' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            分支: `${{ github.ref_name }}`
            提交: ${{ github.event.head_commit.message }}
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true

      - name: Send APK to Telegram
        if: always()
        continue-on-error: true
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            curl -s -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -F document=@"app/build/outputs/apk/debug/app-debug.apk" \
                 -F caption="✅ Build #${{ github.run_number }} 成功 | ${{ github.ref_name }}" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          else
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                 -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -d text="❌ Build #${{ github.run_number }} 失败 | ${{ github.ref_name }} | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
